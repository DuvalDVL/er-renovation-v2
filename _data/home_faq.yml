- q: "Intervenez-vous en urgence après un dégât des eaux ?"
  a: "Nous intervenons une fois la fuite réparée. Nous ne réalisons ni la recherche de fuite ni la réparation de la canalisation : après le plombier, nous posons un déshumidificateur pour assécher les supports, puis nous refaisons plâtre, enduit et peinture."
- q: "Le devis est-il gratuit ?"
  a: "Oui, le devis est gratuit. Il est établi après une visite ou à partir de photos, selon le chantier, et détaille les travaux prévus."
- q: "Dans quelle zone intervenez-vous ?"
  a: "Principalement à Passy, Sallanches, Saint-Gervais, Chamonix et Megève. Pour un chantier plus éloigné en Haute-Savoie, jusqu'à Thonon, contactez-nous : nous étudions chaque demande."
- q: "Pouvez-vous intervenir pour une agence immobilière ou un syndic ?"
  a: "Oui, une grande partie de nos chantiers sont réalisés pour des agences : remise en état de logements entre deux locataires, avant une vente ou après un sinistre. Nous travaillons avec un interlocuteur unique, des devis rapides et des délais annoncés."
- q: "Faites-vous les déménagements et les débarras pour tout le monde ?"
  a: "Oui, pour les particuliers comme pour les professionnels. Le chantier peut inclure le nettoyage et la remise en état du logement libéré."
- q: "Quels travaux de plâtrerie réalisez-vous ?"
  a: "De petits travaux au forfait : caissons, création ou réparation de cloisons, reprises de placo. Nous ne prenons pas de gros chantiers de plâtrerie complets."
