{%- if site.data.site.ga4 != "" -%}
<div id="cookie-bar" role="dialog" aria-label="Cookies" hidden style="position:fixed;left:12px;right:12px;bottom:12px;z-index:80;background:#111;color:#fff;padding:18px 20px;border-radius:0;border:1px solid #3a3733;font-size:.9rem;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:560px">
  <p style="margin:0 0 12px">Nous utilisons Google Analytics pour mesurer l'audience du site, uniquement avec votre accord. <a href="{{ '/politique-de-confidentialite/' | relative_url }}" style="color:#c4a16b">En savoir plus</a></p>
  <div style="display:flex;gap:8px"><button type="button" class="btn" data-c="granted" style="padding:13px 18px;background:#c4a16b;color:#111">Accepter</button><button type="button" class="btn" data-c="denied" style="padding:13px 18px;background:transparent;color:#fff;border-color:#76706a">Refuser</button></div>
</div>
<script>
(function(){
var ID="{{ site.data.site.ga4 }}",bar=document.getElementById('cookie-bar'),k='cookieConsent',v=null;
try{v=localStorage.getItem(k)}catch(e){}
function load(){if(window.__ga)return;window.__ga=1;var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',ID)}
if(v==='granted')load();else if(!v)bar.hidden=false;
bar.addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-c');if(!c)return;try{localStorage.setItem(k,c)}catch(x){}bar.hidden=true;if(c==='granted')load()});
var m=document.getElementById('cookie-manage');if(m)m.addEventListener('click',function(){try{localStorage.removeItem(k)}catch(x){}bar.hidden=false});
})();
</script>
{%- endif -%}
